name: Public site and SEO build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build public Vite app
        run: npm run build
      - name: Compile SEO serverless handlers
        run: |
          npx esbuild api/public-article.ts api/sitemap.ts api/realtyflow/publish.ts \
            --outdir=/tmp/donaanna-api-check \
            --bundle --platform=node --format=esm --external:@supabase/supabase-js
      - name: Validate deployment routing configuration
        run: node -e "const c=require('./vercel.json'); if(!c.rewrites?.some(r=>r.source==='/sitemap.xml') || !c.rewrites?.some(r=>r.source==='/magasin/:slug')) process.exit(1)"
